<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GI Study — App Structure</title>
<style>
  :root { --ink: #12211b; --muted: #5c7065; --line: #dfe8e3; --head: #0b3d2e; }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    line-height: 1.45;
    margin: 0;
    padding: 24px;
    background: #f5f8f6;
  }
  .page { max-width: 820px; margin: 0 auto; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 24px; }
  .subtitle { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .print-btn {
    padding: 12px 18px; font-size: 15px; font-weight: 700; border-radius: 12px;
    border: none; background: var(--head); color: #fff; cursor: pointer;
  }
  .domain { margin-bottom: 22px; page-break-inside: avoid; }
  .domain-head { display: flex; align-items: baseline; gap: 10px; border-bottom: 2px solid var(--head); padding-bottom: 6px; margin-bottom: 10px; }
  .domain-head h2 { margin: 0; font-size: 19px; }
  .domain-head .icon { font-size: 20px; }
  .topic { margin: 12px 0; page-break-inside: avoid; }
  .topic-name { font-weight: 800; margin-bottom: 4px; }
  .paper-list { list-style: none; margin: 0; padding-left: 18px; }
  .paper-list li { margin: 3px 0; font-size: 14px; }
  .chip { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 700; background: #eef3f0; color: #39554a; margin-left: 6px; vertical-align: 1px; }
  .chip.soc { background: #e8f0fb; color: #1f5faa; }
  .chip.year { background: #f1f3f8; color: #5a6478; }
  .chip.star { background: #fff3d6; color: #8a6500; }
  .legend { font-size: 13px; color: var(--muted); margin-bottom: 18px; padding: 12px; background: #fff; border: 1px solid var(--line); border-radius: 12px; }
  @media print {
    body { background: #fff; padding: 0; }
    .topbar { display: none; }
    .domain { break-inside: avoid; }
    a { color: inherit; text-decoration: none; }
  }
</style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div>
        <h1>GI Study — App Structure</h1>
        <p class="subtitle">16 domains · 93 topics · <span id="count">…</span> studies</p>
      </div>
      <button class="print-btn" onclick="window.print()">🖨 Print / Save as PDF</button>
    </div>

    <div class="legend">
      <strong>Legend:</strong> <span class="chip star">★</span> core reading ·
      <span class="chip">CPU</span> AGA Clinical Practice Update ·
      <span class="chip soc">Society</span> ·
      <span class="chip year">Year</span> · blank year = no year listed
    </div>

    <div id="out"></div>
  </div>

  <script src="./data.js"></script>
  <script>
    const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function render() {
      let total = 0;
      let html = '';
      DOMAINS.forEach(d => {
        let dCount = 0;
        d.topics.forEach(t => dCount += t.papers.length);
        total += dCount;

        html += '<div class="domain">';
        html += '<div class="domain-head"><span class="icon">' + d.icon + '</span><h2>' + esc(d.name) + '</h2></div>';
        d.topics.forEach(t => {
          html += '<div class="topic">';
          html += '<div class="topic-name">' + esc(t.name) + ' <span style="color:var(--muted);font-weight:400;font-size:12px">(' + t.papers.length + ')</span></div>';
          html += '<ul class="paper-list">';
          t.papers.forEach(p => {
            let chips = '<span class="chip soc">' + esc(p.society) + '</span>';
            if (p.year) chips += '<span class="chip year">' + p.year + '</span>';
            p.tags.forEach(tag => chips += '<span class="chip' + (tag === '★' ? ' star' : '') + '">' + esc(tag) + '</span>');
            html += '<li>' + esc(p.title) + chips + '</li>';
          });
          html += '</ul></div>';
        });
        html += '</div>';
      });
      document.getElementById('out').innerHTML = html;
      document.getElementById('count').textContent = total;
    }

    if (typeof DOMAINS === 'undefined') {
      document.getElementById('out').innerHTML = '<p style="color:#b3261e"><strong>Could not load data.js.</strong> Make sure structure.html is in the same folder as data.js.</p>';
    } else {
      render();
    }
  </script>
</body>
</html>
